name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Test & Release
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code (full history needed for semantic-release)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Step 2: Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests to verify baseline is healthy
      - name: Run tests
        run: npm test

      # Step 5: Package release artefacts
      - name: Package release artefacts
        run: zip -r release.zip src/ package.json README.md RELEASE-MANAGEMENT.md

      # Step 6: Run semantic-release (tags, changelog, GitHub Release)
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
